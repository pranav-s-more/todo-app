<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Focus List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#687086; --line:#e5e7ee; --brand:#5b4bdb; --surface:#fff; --page:#f6f7fb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--page); font:16px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width:min(720px, calc(100% - 32px)); margin:64px auto; }
    header { margin-bottom:28px; }
    h1 { margin:0; font-size:2rem; letter-spacing:-.04em; }
    header p { margin:6px 0 0; color:var(--muted); }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 32px #1720330a; overflow:hidden; }
    .create { padding:18px; display:grid; grid-template-columns:1fr auto; gap:10px; border-bottom:1px solid var(--line); }
    input, select, button { font:inherit; }
    input, select { min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); background:#fff; }
    #new-task { grid-column:1 / -1; font-size:1rem; }
    .create-options { display:flex; gap:10px; }
    button { cursor:pointer; border:0; border-radius:10px; padding:10px 14px; font-weight:650; color:#fff; background:var(--brand); }
    button:hover { filter:brightness(.94); }
    .toolbar { padding:14px 18px; display:flex; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--line); }
    .toolbar input { flex:1 1 180px; }
    .filters { display:flex; gap:4px; }
    .filter { padding:8px 10px; color:var(--muted); background:transparent; }
    .filter.active { color:var(--brand); background:#eeecff; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:flex-start; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
    li:last-child { border-bottom:0; }
    .check { width:21px; height:21px; margin:2px 0 0; accent-color:var(--brand); }
    .task { flex:1; min-width:0; }
    .group { display:block; padding:0; overflow:hidden; background:#fcfcff; }
    .group-parent { display:flex; align-items:flex-start; gap:12px; padding:16px 18px; }
    .group-parent .task-text { color:#302b71; }
    .group.done .group-parent .task-text { color:var(--muted); }
    .group-children { margin:0; padding:12px 18px 16px 50px; border-top:1px solid #e5e3f5; background:#f5f4ff; }
    .subtask-heading { margin:0 0 8px; color:#6a63ae; font-size:.72rem; font-weight:750; letter-spacing:.08em; text-transform:uppercase; }
    .subtask-list { margin:0; padding-left:13px; border:0; border-left:2px solid #bdb7f2; border-radius:0; overflow:visible; }
    .subtask-list li { position:relative; margin-bottom:7px; padding:10px; gap:9px; border:1px solid #dedbf5; border-radius:10px; background:#fff; }
    .subtask-list li:last-child { margin-bottom:0; }
    .subtask-list li::before { position:absolute; top:19px; left:-14px; width:12px; border-top:2px solid #c9c5f5; content:""; }
    .subtask-list .task-text { font-size:.92rem; }
    .subtask-list .meta { margin-top:3px; }
    .subtask-kind { color:#6a63ae; font-size:.72rem; font-weight:700; }
    .task-text { display:block; overflow-wrap:anywhere; font-weight:600; }
    .done .task-text { color:var(--muted); text-decoration:line-through; }
    .meta { display:flex; gap:7px; align-items:center; margin-top:5px; color:var(--muted); font-size:.8rem; }
    .badge { border-radius:999px; padding:2px 7px; font-weight:650; text-transform:capitalize; background:#f0f1f5; }
    .high { color:#a63131; background:#ffeded; } .medium { color:#8b5c00; background:#fff4d6; } .low { color:#237451; background:#e7f7ee; }
    .actions { display:flex; gap:4px; }
    .icon { padding:5px 8px; color:var(--muted); background:transparent; font-size:.9rem; }
    .icon:hover { color:var(--ink); background:#f1f2f6; }
    .empty { padding:44px 18px; color:var(--muted); text-align:center; }
    .status { min-height:20px; padding:10px 18px 0; color:#b42318; font-size:.85rem; }
    .modal-backdrop { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:20px; background:#17203366; }
    .modal-backdrop[hidden] { display:none; }
    .modal { width:min(100%, 390px); padding:24px; border-radius:18px; background:#fff; box-shadow:0 24px 60px #17203340; }
    .modal h2 { margin:0; font-size:1.2rem; letter-spacing:-.02em; }
    .modal p { margin:8px 0 22px; color:var(--muted); }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; }
    .cancel { color:var(--ink); background:#eef0f5; }
    .danger { background:#c53535; }
    @media (max-width:520px) { main{ margin:32px auto; } .create { grid-template-columns:1fr; } .create button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Focus List</h1><p>Make room for what matters today.</p></header>
    <section class="card">
      <form class="create" id="todo-form">
        <input id="new-task" type="text" maxlength="200" placeholder="What needs to get done?" autocomplete="off" required />
        <div class="create-options"><select id="priority" aria-label="Priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input id="due-date" type="date" aria-label="Due date" /></div>
        <button type="submit">Add task</button>
      </form>
      <div class="toolbar"><input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks" /><div class="filters" aria-label="Task filter"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="done">Done</button></div></div>
      <p class="status" id="status" role="alert"></p><ul id="list"></ul>
    </section>
  </main>
  <div class="modal-backdrop" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" hidden>
    <div class="modal">
      <h2 id="delete-title">Delete task?</h2>
      <p id="delete-message">This task will be permanently removed from your list.</p>
      <div class="modal-actions"><button class="cancel" id="cancel-delete" type="button">Cancel</button><button class="danger" id="confirm-delete" type="button">Delete task</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="subtask-modal" role="dialog" aria-modal="true" aria-labelledby="subtask-title" hidden>
    <form class="modal" id="subtask-form">
      <h2 id="subtask-title">Add a subtask</h2>
      <p id="subtask-parent">Break this task into a smaller next step.</p>
      <input id="subtask-text" type="text" maxlength="200" placeholder="What is the next step?" autocomplete="off" required />
      <div class="create-options" style="margin-top:10px"><select id="subtask-priority" aria-label="Subtask priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input id="subtask-due-date" type="date" aria-label="Subtask due date" /></div>
      <div class="modal-actions" style="margin-top:22px"><button class="cancel" id="cancel-subtask" type="button">Cancel</button><button type="submit">Add subtask</button></div>
    </form>
  </div>
  <div class="modal-backdrop" id="pending-modal" role="dialog" aria-modal="true" aria-labelledby="pending-title" hidden>
    <div class="modal">
      <h2 id="pending-title">Subtasks still pending</h2>
      <p id="pending-message"></p>
      <div class="modal-actions"><button class="cancel" id="cancel-pending" type="button">Keep working</button><button id="confirm-parent-complete" type="button">Complete anyway</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="due-date-modal" role="dialog" aria-modal="true" aria-labelledby="due-date-title" hidden>
    <div class="modal">
      <h2 id="due-date-title">Subtask deadline is too late</h2>
      <p id="due-date-message"></p>
      <div class="modal-actions"><button id="close-due-date-warning" type="button">Choose another date</button></div>
    </div>
  </div>

  <script>
    let todos = [];
    let filter = 'all';
    let todoToDelete = null;
    let parentForSubtask = null;
    let parentToComplete = null;
    const status = document.getElementById('status');
    const deleteModal = document.getElementById('delete-modal');
    const subtaskModal = document.getElementById('subtask-modal');
    const pendingModal = document.getElementById('pending-modal');
    const dueDateModal = document.getElementById('due-date-modal');

    function showError(message = '') { status.textContent = message; }
    function isChildOf(todo, parentId) { return Number(todo.parentId) === Number(parentId); }
    function renderTodos() {
      const search = document.getElementById('search').value.toLowerCase();
      const matches = todo => (filter === 'all' || (filter === 'done' ? todo.done : !todo.done)) && todo.text.toLowerCase().includes(search);
      const visibleTodos = todos.filter(todo => !todo.parentId && (matches(todo) || todos.some(child => isChildOf(child, todo.id) && matches(child))));

      const list = document.getElementById('list');
      list.innerHTML = '';

      if (!visibleTodos.length) { list.innerHTML = '<li class="empty">No tasks here yet.</li>'; return; }
      visibleTodos.forEach(t => {
        const li = createTaskItem(t, false);
        const subtasks = todos.filter(child => isChildOf(child, t.id) && matches(child));
        if (subtasks.length) {
          li.classList.add('group');
          const parentRow = document.createElement('div');
          parentRow.className = 'group-parent';
          while (li.firstChild) parentRow.appendChild(li.firstChild);
          const heading = document.createElement('div');
          heading.className = 'subtask-heading';
          heading.textContent = `Subtasks · ${subtasks.length}`;
          const subtaskList = document.createElement('ul');
          subtaskList.className = 'subtask-list';
          subtasks.forEach(child => subtaskList.appendChild(createTaskItem(child, true)));
          const childrenSection = document.createElement('section');
          childrenSection.className = 'group-children';
          childrenSection.append(heading, subtaskList);
          li.append(parentRow, childrenSection);
        }
        list.appendChild(li);
      });
    }

    function createTaskItem(t, isSubtask) {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        li.innerHTML = `<input class="check" type="checkbox" aria-label="Mark task complete" ${t.done ? 'checked' : ''}><div class="task"><span class="task-text"></span><div class="meta">${isSubtask ? '<span class="subtask-kind">Subtask</span>' : '<span class="subtask-kind">Task</span>'}<span class="badge ${t.priority || 'medium'}">${t.priority || 'medium'}</span>${t.dueDate ? `<span>Due ${new Date(t.dueDate + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>` : ''}</div></div><div class="actions">${isSubtask ? '' : '<button class="icon subtask" aria-label="Add subtask">Subtask</button>'}<button class="icon edit" aria-label="Edit task">Edit</button><button class="icon delete" aria-label="Delete task">Delete</button></div>`;
        li.querySelector('.task-text').textContent = t.text;
        li.querySelector('.check').addEventListener('click', event => toggleTask(t, event));
        if (!isSubtask) li.querySelector('.subtask').addEventListener('click', () => openSubtaskModal(t));
        li.querySelector('.edit').addEventListener('click', () => editTodo(t));
        li.querySelector('.delete').addEventListener('click', () => openDeleteModal(t.id));
        return li;
    }

    async function loadTodos() { try { const res = await fetch('/api/todos'); if (!res.ok) throw new Error(); todos = await res.json(); renderTodos(); } catch { showError('Could not load your tasks.'); } }

    async function addTodo(event) {
      event.preventDefault();
      const input = document.getElementById('new-task');
      try { const response = await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: input.value, priority: document.getElementById('priority').value, dueDate: document.getElementById('due-date').value || null })
      });
      if (!response.ok) throw new Error(); document.getElementById('todo-form').reset(); showError(); await loadTodos(); } catch { showError('Could not add the task. Please try again.'); }
    }

    async function updateTodo(id, changes) {
      try { const response = await fetch(`/api/todos/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes) }); if (!response.ok) throw new Error(); showError(); await loadTodos(); } catch { showError('Could not save that change.'); }
    }

    function toggleTask(todo, event) {
      const pendingSubtasks = todos.filter(child => isChildOf(child, todo.id) && !child.done);
      if (!todo.done && pendingSubtasks.length) {
        event.preventDefault();
        event.target.checked = false;
        parentToComplete = todo.id;
        document.getElementById('pending-message').textContent = `${pendingSubtasks.length} subtask${pendingSubtasks.length === 1 ? ' is' : 's are'} still pending. You can finish the group anyway or keep working on them first.`;
        pendingModal.hidden = false;
        document.getElementById('cancel-pending').focus();
        return;
      }
      updateTodo(todo.id, { done: !todo.done });
    }

    function openDeleteModal(id) {
      todoToDelete = id;
      const pendingSubtasks = todos.filter(todo => isChildOf(todo, id) && !todo.done);
      const title = document.getElementById('delete-title');
      const message = document.getElementById('delete-message');
      const confirmButton = document.getElementById('confirm-delete');
      if (pendingSubtasks.length) {
        title.textContent = 'Delete group with pending subtasks?';
        message.textContent = `${pendingSubtasks.length} subtask${pendingSubtasks.length === 1 ? ' is' : 's are'} still unfinished. Deleting this group permanently removes the parent task and every subtask.`;
        confirmButton.textContent = 'Delete group';
      } else {
        title.textContent = 'Delete task?';
        message.textContent = 'This task will be permanently removed from your list.';
        confirmButton.textContent = 'Delete task';
      }
      deleteModal.hidden = false;
      document.getElementById('cancel-delete').focus();
    }
    function closeDeleteModal() { todoToDelete = null; deleteModal.hidden = true; }
    async function deleteTodo() {
      if (todoToDelete === null) return;
      const id = todoToDelete;
      closeDeleteModal();
      try { const response = await fetch(`/api/todos/${id}`, { method: 'DELETE' }); if (!response.ok) throw new Error(); showError(); await loadTodos(); } catch { showError('Could not delete the task.'); }
    }

    function editTodo(todo) { const text = prompt('Update task', todo.text); if (text !== null && text.trim()) updateTodo(todo.id, { text: text.trim() }); }
    function openSubtaskModal(parent) { parentForSubtask = parent.id; document.getElementById('subtask-parent').textContent = `Add a step under “${parent.text}”.`; subtaskModal.hidden = false; document.getElementById('subtask-text').focus(); }
    function closeSubtaskModal() { parentForSubtask = null; subtaskModal.hidden = true; document.getElementById('subtask-form').reset(); }
    function closePendingModal() { parentToComplete = null; pendingModal.hidden = true; }
    function completeParentAnyway() { if (parentToComplete === null) return; const id = parentToComplete; closePendingModal(); updateTodo(id, { done:true, forceComplete:true }); }
    function showDueDateWarning(parentDueDate) { document.getElementById('due-date-message').textContent = `This subtask must be due on or before its parent task’s deadline of ${new Date(parentDueDate + 'T00:00:00').toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' })}.`; dueDateModal.hidden = false; document.getElementById('close-due-date-warning').focus(); }
    function closeDueDateWarning() { dueDateModal.hidden = true; document.getElementById('subtask-due-date').focus(); }
    async function addSubtask(event) { event.preventDefault(); if (parentForSubtask === null) return; const dueDate = document.getElementById('subtask-due-date').value || null; const parent = todos.find(todo => Number(todo.id) === Number(parentForSubtask)); if (parent && parent.dueDate && dueDate && dueDate > parent.dueDate) { showDueDateWarning(parent.dueDate); return; } try { const response = await fetch('/api/todos', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ text:document.getElementById('subtask-text').value, priority:document.getElementById('subtask-priority').value, dueDate, parentId:parentForSubtask }) }); if (!response.ok) throw new Error(); closeSubtaskModal(); showError(); await loadTodos(); } catch { showError('Could not add the subtask.'); } }
    document.getElementById('todo-form').addEventListener('submit', addTodo);
    document.getElementById('search').addEventListener('input', renderTodos);
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { filter = button.dataset.filter; document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button)); renderTodos(); }));
    document.getElementById('confirm-delete').addEventListener('click', deleteTodo);
    document.getElementById('cancel-delete').addEventListener('click', closeDeleteModal);
    document.getElementById('subtask-form').addEventListener('submit', addSubtask);
    document.getElementById('cancel-subtask').addEventListener('click', closeSubtaskModal);
    document.getElementById('cancel-pending').addEventListener('click', closePendingModal);
    document.getElementById('confirm-parent-complete').addEventListener('click', completeParentAnyway);
    document.getElementById('close-due-date-warning').addEventListener('click', closeDueDateWarning);
    deleteModal.addEventListener('click', event => { if (event.target === deleteModal) closeDeleteModal(); });
    subtaskModal.addEventListener('click', event => { if (event.target === subtaskModal) closeSubtaskModal(); });
    pendingModal.addEventListener('click', event => { if (event.target === pendingModal) closePendingModal(); });
    dueDateModal.addEventListener('click', event => { if (event.target === dueDateModal) closeDueDateWarning(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { if (!deleteModal.hidden) closeDeleteModal(); if (!subtaskModal.hidden) closeSubtaskModal(); if (!pendingModal.hidden) closePendingModal(); if (!dueDateModal.hidden) closeDueDateWarning(); } });

    loadTodos();
  </script>
</body>
</html>
