<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Taskolab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main>
    <header><h1>Taskolab</h1><p>Plan, organize, and move work forward.</p></header>
    <section class="card">
      <form class="create" id="todo-form">
        <input id="new-task" type="text" maxlength="200" placeholder="What needs to get done?" autocomplete="off" required />
        <div class="create-options"><select id="priority" aria-label="Priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input id="due-date" type="date" aria-label="Due date" /></div>
        <button type="submit">Add task</button>
      </form>
      <div class="toolbar"><input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks" /><div class="filters" aria-label="Task filter"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="done">Done</button></div></div>
      <p class="status" id="status" role="alert"></p><ul id="list"></ul>
    </section>
  </main>
  <div class="modal-backdrop" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" hidden>
    <div class="modal">
      <h2 id="delete-title">Delete task?</h2>
      <p id="delete-message">This task will be permanently removed from your list.</p>
      <div class="modal-actions"><button class="cancel" id="cancel-delete" type="button">Cancel</button><button class="danger" id="confirm-delete" type="button">Delete task</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="subtask-modal" role="dialog" aria-modal="true" aria-labelledby="subtask-title" hidden>
    <form class="modal" id="subtask-form">
      <h2 id="subtask-title">Add a subtask</h2>
      <p id="subtask-parent">Break this task into a smaller next step.</p>
      <input id="subtask-text" type="text" maxlength="200" placeholder="What is the next step?" autocomplete="off" required />
      <div class="create-options subtask-options"><select id="subtask-priority" aria-label="Subtask priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input id="subtask-due-date" type="date" aria-label="Subtask due date" /></div>
      <div class="modal-actions subtask-actions"><button class="cancel" id="cancel-subtask" type="button">Cancel</button><button type="submit">Add subtask</button></div>
    </form>
  </div>
  <div class="modal-backdrop" id="pending-modal" role="dialog" aria-modal="true" aria-labelledby="pending-title" hidden>
    <div class="modal">
      <h2 id="pending-title">Subtasks still pending</h2>
      <p id="pending-message"></p>
      <div class="modal-actions"><button class="cancel" id="cancel-pending" type="button">Keep working</button><button id="confirm-parent-complete" type="button">Complete anyway</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="due-date-modal" role="dialog" aria-modal="true" aria-labelledby="due-date-title" hidden>
    <div class="modal">
      <h2 id="due-date-title">Subtask deadline is too late</h2>
      <p id="due-date-message"></p>
      <div class="modal-actions"><button id="close-due-date-warning" type="button">Choose another date</button></div>
    </div>
  </div>

  <script src="/js/app.js" defer></script>
</body>
</html>
