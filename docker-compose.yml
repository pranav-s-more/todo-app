name: taskolab

services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Docker service names provide internal DNS. This overrides the local .env value.
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Keep local application logs available outside the container.
      - ./logs:/app/logs
    networks:
      - taskolab-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Reuses the existing local database volume and therefore preserves current tasks.
      - taskolab_mysql_data:/var/lib/mysql
    networks:
      - taskolab-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taskolab-network
    restart: unless-stopped

networks:
  taskolab-network:
    name: taskolab-network
    driver: bridge

volumes:
  taskolab_mysql_data:
    # This pre-existing volume contains the current MySQL database.
    external: true
    name: todo_app_mysql_data
